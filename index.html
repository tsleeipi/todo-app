<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f3f4f6; color: #1f2937;
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  .app { width: 100%; max-width: 480px; background: #fff; border-radius: 12px;
         box-shadow: 0 4px 16px rgba(0,0,0,.08); padding: 24px; align-self: flex-start; }
  h1 { margin: 0 0 16px; font-size: 22px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 8px; }
  input[type=text]:focus { outline: 2px solid #6366f1; border-color: transparent; }
  button { cursor: pointer; border: 0; border-radius: 8px; font-size: 15px; }
  form button { padding: 0 16px; background: #6366f1; color: #fff; }
  form button:hover { background: #4f46e5; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #f0f0f0; }
  li input { width: 18px; height: 18px; cursor: pointer; }
  li span { flex: 1; word-break: break-all; }
  li.done span { text-decoration: line-through; color: #9ca3af; }
  li .del { background: none; color: #9ca3af; font-size: 18px; padding: 0 6px; }
  li .del:hover { color: #ef4444; }
  .footer { margin-top: 12px; font-size: 13px; color: #6b7280; display: flex; justify-content: space-between; align-items: center; }
  .footer button { background: none; color: #6b7280; font-size: 13px; text-decoration: underline; }
  .empty { text-align: center; color: #9ca3af; padding: 20px 0; }
</style>
</head>
<body>
<div class="app">
  <h1>📝 할 일 목록</h1>
  <form id="form">
    <input type="text" id="input" placeholder="할 일을 입력하세요" autocomplete="off" required>
    <button type="submit">추가</button>
  </form>
  <ul id="list"></ul>
  <div class="footer">
    <span id="count"></span>
    <button id="clear" type="button">완료 항목 삭제</button>
  </div>
</div>

<script>
  const KEY = 'todos-v1';
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

  const $list = document.getElementById('list');
  const $count = document.getElementById('count');
  const $input = document.getElementById('input');

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {}
  }

  function render() {
    $list.innerHTML = '';
    if (!todos.length) {
      $list.innerHTML = '<li class="empty" style="justify-content:center">할 일이 없습니다 🎉</li>';
    }
    const ordered = todos.filter(t => !t.done).concat(todos.filter(t => t.done));
    ordered.forEach(t => {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };

      const span = document.createElement('span');
      span.textContent = t.text;

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = '삭제';
      del.onclick = () => { todos = todos.filter(x => x.id !== t.id); save(); render(); };

      li.append(cb, span, del);
      $list.appendChild(li);
    });
    const left = todos.filter(t => !t.done).length;
    $count.textContent = `남은 할 일 ${left}개 / 전체 ${todos.length}개`;
  }

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const text = $input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    $input.value = '';
    save(); render();
  };

  document.getElementById('clear').onclick = () => {
    todos = todos.filter(t => !t.done);
    save(); render();
  };

  render();
</script>
</body>
</html>
